name: Core CI

on:
  push:
    branches: [main, dev/v0.1-core, "dev/stage-*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and build tooling
        run: python -m pip install --disable-pip-version-check -e ".[ui-test]" build pyinstaller pip-audit

      - name: Compile
        run: python -m compileall -q src tests

      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: CLI smoke test
        run: python -m nexvary_da --help

      - name: Scene Director media smoke
        run: python tests/scene_director_render_smoke.py

      - name: Diff check
        run: git diff --check

      - name: Security source and secret scan
        run: python tests/security_scan_smoke.py

      - name: Dependency vulnerability audit
        run: python -m pip_audit -r security/requirements-audit.txt --strict --progress-spinner off

      - name: Install Xvfb for runtime UI probe
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb

      - name: Runtime UI probe with screenshot
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python tests/ui_probe_smoke.py --screenshot-output ui-probe.png --require-screenshot

      - name: Navigation Integrity Probe
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python tests/navigation_probe_smoke.py

      - name: Runtime UI probe
        if: runner.os == 'Windows'
        run: python tests/ui_probe_smoke.py

      - name: Navigation Integrity Probe
        if: runner.os == 'Windows'
        run: python tests/navigation_probe_smoke.py

      - name: Upload UI probe screenshot
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: nexvary-da-ui-probe-${{ runner.os }}
          path: ui-probe.png
          if-no-files-found: error
          retention-days: 14

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution files
        run: python -c "from pathlib import Path; files=list(Path('dist').iterdir()); assert any(p.suffix == '.whl' for p in files), files; assert any(p.name.endswith('.tar.gz') for p in files), files; print(*[p.name for p in files], sep='\n')"

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v6
        with:
          name: nexvary-da-${{ runner.os }}-py${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Build native executable
        run: python -m PyInstaller --noconfirm --clean --onefile --collect-all imageio_ffmpeg --name NEXVARY-DA --distpath dist-native --workpath build-native packaging/launcher.py

      - name: Build windowed desktop executable
        if: runner.os == 'Windows'
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-all imageio_ffmpeg --name NEXVARY-DA-GUI --distpath dist-native --workpath build-native-gui packaging/gui_launcher.py

      - name: Native executable smoke test
        run: python tests/native_binary_smoke.py

      - name: Build Windows GUI executable
        if: runner.os == 'Windows'
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-all imageio_ffmpeg --name NEXVARY-DA-GUI --distpath dist-native --workpath build-native-gui packaging/gui_launcher.py

      - name: Smoke Windows GUI executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NEXVARY_DA_APPDATA = Join-Path $env:RUNNER_TEMP "nexvary-da-gui-smoke"
          $p = Start-Process -FilePath ".\dist-native\NEXVARY-DA-GUI.exe" -ArgumentList "--smoke" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "GUI launcher smoke failed: $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $env:NEXVARY_DA_APPDATA "Workspace\.nexvary-da\project.json"))) {
            throw "GUI launcher did not create its first-run workspace"
          }
          $ui = Start-Process -FilePath ".\dist-native\NEXVARY-DA-GUI.exe" -ArgumentList "--ui-smoke" -Wait -PassThru
          if ($ui.ExitCode -ne 0) { throw "Packaged GUI open-close smoke failed: $($ui.ExitCode)" }

      - name: Package native portable bundle
        run: python packaging/package_native.py

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\NSIS\makensis.exe" packaging\windows\NEXVARY-DA.nsi'

      - name: Smoke Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\packaging\windows\smoke_installer.ps1

      - name: Build Debian package
        if: runner.os == 'Linux'
        run: python packaging/build_deb.py

      - name: Smoke Debian package
        if: runner.os == 'Linux'
        run: |
          sudo dpkg -i release-native/*.deb
          /usr/local/bin/nexvary-da --help
          sudo dpkg -r nexvary-da

      - name: Upload native portable and installer bundles
        uses: actions/upload-artifact@v6
        with:
          name: nexvary-da-native-${{ runner.os }}
          path: |
            release-native/*.tar.gz
            release-native/*.zip
            release-native/*.sha256
            release-native/*.deb
            release-native/*Setup.exe
          if-no-files-found: error
          retention-days: 14
