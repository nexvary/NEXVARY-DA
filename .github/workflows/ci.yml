name: Core CI

on:
  push:
    branches: [main, dev/v0.1-core]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and build tooling
        run: python -m pip install --disable-pip-version-check -e ".[ui-test]" build

      - name: Compile
        run: python -m compileall -q src tests

      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: CLI smoke test
        run: python -m nexvary_da --help

      - name: Diff check
        run: git diff --check

      - name: Install Xvfb for runtime UI probe
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb

      - name: Runtime UI probe with screenshot
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python tests/ui_probe_smoke.py --screenshot-output ui-probe.png --require-screenshot

      - name: Runtime UI probe
        if: runner.os == 'Windows'
        run: python tests/ui_probe_smoke.py

      - name: Upload UI probe screenshot
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: nexvary-da-ui-probe-${{ runner.os }}
          path: ui-probe.png
          if-no-files-found: error
          retention-days: 14

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution files
        run: python -c "from pathlib import Path; files=list(Path('dist').iterdir()); assert any(p.suffix == '.whl' for p in files), files; assert any(p.name.endswith('.tar.gz') for p in files), files; print(*[p.name for p in files], sep='\n')"

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v6
        with:
          name: nexvary-da-${{ runner.os }}-py${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
