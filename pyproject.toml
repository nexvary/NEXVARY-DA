[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexvary-da"
version = "0.1.0"
description = "Local permission-gated developer agent runtime"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "NEXVARY" }]
dependencies = ["mcp>=2,<3"]

[project.scripts]
nexvary-da = "nexvary_da.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
